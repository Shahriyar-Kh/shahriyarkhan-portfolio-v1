{% extends "admin/base.html" %}
{% block content %}
<h1>{{ title }}</h1>
<form method="post" novalidate>{% csrf_token %}
  {{ form.non_field_errors }}
  {% for field in form %}<div class="form-row">{{ field.errors }}<label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% if field.help_text %}<p class="help">{{ field.help_text }}</p>{% endif %}</div>{% endfor %}
  <div class="submit-row"><input type="submit" value="Create draft" class="default"></div>
</form>
{% endblock %}
